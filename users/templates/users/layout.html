<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

  <style>
    .like-content {
      display: inline-block;
      width: 100%;
      margin: 40px 0 0;
      padding: 40px 0 0;
      font-size: 18px;
      border-top: 10px dashed #eee;
      text-align: center;
    }
    .like-content span {
      color: #9d9da4;
      font-family: monospace;
    }
    .like-content .btn-secondary {
        display: block;
        margin: 40px auto 0px;
        text-align: center;
        background: #ed2553;
        border-radius: 3px;
        box-shadow: 0 10px 20px -8px rgb(240, 75, 113);
        padding: 10px 17px;
        font-size: 18px;
        cursor: pointer;
        border: none;
        outline: none;
        color: #ffffff;
        text-decoration: none;
        -webkit-transition: 0.3s ease;
        transition: 0.3s ease;
    }
  .like-content .btn-secondary:hover {
      transform: translateY(-3px);
    }
    .like-content .btn-secondary .fa {
        margin-right: 5px;
    }
    .animate-like {
      animation-name: likeAnimation;
      animation-iteration-count: 1;
      animation-fill-mode: forwards;
      animation-duration: 0.65s;
    }
    @keyframes likeAnimation {
      0%   { transform: scale(30); }
      100% { transform: scale(1); }
    }
  </style>

  
  </head>
  <body>

    <!-- navbar  -->
    <nav class="navbar navbar-expand-lg navbar-primary bg-primary">
      <a class="navbar-brand text-light" href="#">PostShare</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <ul class="navbar-nav ml-auto">
         <button class="btn btn-sm btn-light">
            <li class="nav-item active">  
              <a class="nav-link text-dark" href="
              #">Homepage<span class="sr-only"></span></a>
            </li>
            </button>
            &nbsp;&nbsp;&nbsp;&nbsp;
      </ul>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ml-auto">
          <form class="form-inline my-2 my-lg-0">
            <input class="form-control mr-sm-2" type="search" placeholder="Search trends..." aria-label="Search">
            <button class="btn btn-success my-2 my-sm-0" type="submit">Search</button>
           </form>   
           &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          
         
          {% if user.is_authenticated %}
             <button class="btn btn-sm btn-light">
            <li class="nav-item active">  
              <a class="nav-link text-dark" href="{% url 'feed:timeline'  %}">Timeline<span class="sr-only"></span></a>
            </li>
            </button>
            &nbsp;&nbsp;&nbsp;&nbsp;

          <button class="btn btn-sm btn-light">
            <li class="nav-item active">  
              <a class="nav-link text-dark" href="{% url 'edit-profile' request.user.id %}">Profile<span class="sr-only"></span></a>
            </li>
            </button>
            &nbsp;&nbsp;&nbsp;&nbsp;

           <button class="btn btn-sm btn-light">
            <li class="nav-item active">  
              <a class="nav-link text-dark" href="{%url 'logout' %}">Logout<span class="sr-only"></span></a>
            </li>
            </button>
             &nbsp;&nbsp;&nbsp;&nbsp;
           
      
          {% else %}

           <button class="btn btn-light">
            <li class="nav-item active">
              <a class="nav-link text-dark" href="{% url 'signup' %}">Signup <span class="sr-only">(current)</span></a>
            </li>
          </button>
          &nbsp;&nbsp;&nbsp;&nbsp;

          <button class="btn btn-light">
            <li class="nav-item">
              <a class="nav-link text-primary" href="{% url 'login' %}">Login</a>
            </li>
          </button>

          {% endif %}
        </ul>
      </div>
    </nav>
    {% block content %}

    {% endblock %}

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
  </body>
</html>
